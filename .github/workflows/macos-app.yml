name: Build Dharma Studio.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14            # Apple Silicon (arm64): M1 and later
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the UI
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,dev]"

      - name: Tests
        run: python -m pytest -q -x tests || echo "::warning::tests failed (app still built)"

      - name: App icon
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s desktop/icon_1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d desktop/icon_1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o desktop/icon.icns

      - name: Build Dharma Studio.app
        run: pyinstaller desktop/DharmaStudio.spec --noconfirm

      - name: Smoke-test the bundle (headless)
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          "dist/Dharma Studio.app/Contents/MacOS/Dharma Studio" --headless > app.log 2>&1 &
          for i in $(seq 1 120); do URL=$(grep -m1 '^http' app.log || true); [ -n "$URL" ] && break; sleep 2; done
          cat app.log | tail -20
          [ -n "$URL" ] || { echo "app did not start"; exit 1; }
          curl -sf "${URL}api/project" | head -c 300; echo
          curl -sf "${URL}api/pages?chapter_id=1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(len(d),'pages');assert len(d)==10"
          curl -sf "$URL" | grep -q 'id="root"' && echo "UI ok"
          pkill -f "Dharma Studio.app" || true

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/Dharma Studio.app"

      - name: Make the .dmg
        run: |
          mkdir -p dmg && cp -R "dist/Dharma Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Dharma Studio" -srcfolder dmg -ov -format UDZO DharmaStudio.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DharmaStudio-dmg
          path: DharmaStudio.dmg

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dharma Studio (latest build)
          make_latest: true
          files: DharmaStudio.dmg
          body: |
            Built from ${{ github.sha }}. Apple Silicon Macs (M1 and later), macOS 13+.
            Install: open the .dmg, drag Dharma Studio to Applications.
            First launch: right-click Dharma Studio → Open (the app is not notarised), then Open again.
            Keys: Project → API keys → Set keys (saved in the macOS Keychain).
            PDF export uses Google Chrome if installed.
