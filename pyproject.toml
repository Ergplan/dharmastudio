[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharma-studio"
version = "1.0.0"
description = "Dharma Studio — a local comic-production studio for The Cycle of Dharma"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10",
    "pikepdf>=8",
    "pyyaml>=6",
    "pypdf>=4",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8"]
desktop = ["pywebview>=5", "keyring>=25", "pyinstaller>=6.6"]

[tool.setuptools]
packages = ["backend", "engine", "engine.comic"]

[tool.setuptools.package-data]
engine = ["*.md", "*.yaml", "refs/*.png", "comic/fonts/*.ttf", "comic/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
